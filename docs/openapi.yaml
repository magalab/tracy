openapi: 3.0.3
info:
  title: Tracy API
  version: 0.2.0
  description: Self-hosted LLM and agent trace observability API.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Service is alive.
  /readyz:
    get:
      operationId: ready
      security: []
      responses:
        '200':
          description: Service is ready.
  /api/v1/auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: User session and the user's active Workspace.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Too many login attempts from the source.
  /api/v1/auth/me:
    get:
      operationId: currentUser
      responses:
        '200':
          description: Current user. The response does not contain an active workspace; workspace selection is client-side state and is sent through X-Tracy-Workspace-ID for workspace-scoped requests.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [user, auth_type]
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      auth_type: { type: string, enum: [session] }
                  - type: object
                    required: [user, workspace_id, auth_type]
                    properties:
                      user: { type: object, nullable: true }
                      workspace_id: { type: string }
                      auth_type: { type: string, enum: [api_key] }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        '200':
          description: The current user session was revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/workspaces:
    get:
      operationId: listWorkspaces
      description: Workspaces available to the current user; selection is client-side state.
      responses:
        '200':
          description: Workspaces available to the current user.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Workspace' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 128 }
      responses:
        '201':
          description: Workspace created; the client may select it.
          content:
            application/json:
              schema:
                type: object
                required: [workspace]
                properties:
                  workspace: { $ref: '#/components/schemas/Workspace' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/workspaces/{workspaceID}/switch:
    post:
      operationId: switchWorkspace
      parameters:
        - name: workspaceID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Workspace access validated for client-side selection.
          content:
            application/json:
              schema:
                type: object
                required: [workspace]
                properties:
                  workspace: { $ref: '#/components/schemas/Workspace' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: User is not a member of the workspace.
  /api/v1/workspaces/{workspaceID}/keys:
    parameters:
      - name: workspaceID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listUserWorkspaceKeys
      description: Lists keys for a workspace; workspace owners only.
      responses:
        '200':
          description: Workspace API keys without plaintext tokens.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/APIKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Workspace owner required. }
    post:
      operationId: createUserWorkspaceKey
      description: Creates a workspace API key; workspace owners only. Plaintext is returned once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                expires_at: { type: string, format: date-time }
      responses:
        '201':
          description: API key created; plaintext token is returned once.
          content:
            application/json:
              schema:
                type: object
                required: [api_key]
                properties:
                  api_key: { $ref: '#/components/schemas/CreatedAPIKey' }
        '400': { description: Invalid key name or expiration. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Workspace owner required. }
  /api/v1/workspaces/{workspaceID}/keys/{keyID}/revoke:
    post:
      operationId: revokeUserWorkspaceKey
      description: Revokes a workspace API key; workspace owners only.
      parameters:
        - name: workspaceID
          in: path
          required: true
          schema: { type: string }
        - name: keyID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: API key revoked.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: boolean, enum: [true] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Workspace owner required. }
        '404': { description: API key not found in workspace. }
  /api/v1/ingest:
    post:
      operationId: ingestSpans
      parameters:
        - $ref: '#/components/parameters/WorkspaceContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spans]
              properties:
                spans:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/SpanInput'
      responses:
        '202':
          description: Spans accepted into the bounded ingest queue.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Ingest queue is full.
  /v1/loop/traces/ingest:
    post:
      operationId: ingestCozeLoopSpans
      description: CozeLoop-compatible trace upload endpoint.
      parameters:
        - $ref: '#/components/parameters/WorkspaceContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spans]
              properties:
                spans:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
      responses:
        '200':
          description: Upload accepted.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/traces:
    get:
      operationId: listTraces
      parameters:
        - $ref: '#/components/parameters/WorkspaceContext'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Kind'
        - $ref: '#/components/parameters/Name'
        - $ref: '#/components/parameters/TraceID'
        - $ref: '#/components/parameters/StartTime'
        - $ref: '#/components/parameters/EndTime'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: min_duration_ms
          in: query
          schema: { type: integer, minimum: 0 }
        - name: max_duration_ms
          in: query
          schema: { type: integer, minimum: 0 }
        - name: min_tokens
          in: query
          schema: { type: integer, minimum: 0 }
        - name: max_tokens
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Current workspace's trace summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TracePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/traces/{traceID}:
    get:
      operationId: getTrace
      description: Returns a paginated trace. Use next_cursor to read large traces without loading the entire trace into one response.
      parameters:
        - $ref: '#/components/parameters/WorkspaceContext'
        - $ref: '#/components/parameters/TracePathID'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Trace spans.
          content:
            application/json:
              schema:
                type: object
                required: [trace_id, spans]
                properties:
                  trace_id: { type: string }
                  spans:
                    type: array
                    items: { $ref: '#/components/schemas/Span' }
                  next_cursor: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Trace not found.
  /api/v1/dashboard:
    get:
      operationId: dashboard
      parameters:
        - $ref: '#/components/parameters/WorkspaceContext'
        - $ref: '#/components/parameters/StartTime'
        - $ref: '#/components/parameters/EndTime'
      responses:
        '200':
          description: Current workspace's metrics, defaulting to the last 24 hours.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardMetrics' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/ingest/stats:
    get:
      operationId: ingestStats
      description: Process-wide writer and queue metrics. A Workspace Owner must provide X-Tracy-Workspace-ID for access control; the returned counters are not filtered by Workspace.
      parameters:
        - $ref: '#/components/parameters/WorkspaceContext'
      responses:
        '200': { description: Ingest statistics. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/oauth/apps:
    get:
      operationId: listOAuthApps
      description: Workspace Owner OAuth App list.
      parameters:
        - $ref: '#/components/parameters/WorkspaceContext'
      responses:
        '200': { description: OAuth Apps. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createOAuthApp
      description: Registers an RSA public key for a CozeLoop JWT OAuth client; Workspace Owner required.
      parameters:
        - $ref: '#/components/parameters/WorkspaceContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, workspace_id, public_key_id, public_key]
              properties:
                client_id: { type: string }
                workspace_id: { type: string }
                public_key_id: { type: string }
                public_key: { type: string, description: RSA PEM public key }
                enabled: { type: boolean, default: true }
      responses:
        '201': { description: OAuth App registered. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/permission/oauth2/token:
    post:
      operationId: exchangeJWTBearerToken
      description: CozeLoop-compatible RS256 JWT bearer exchange.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, grant_type]
              properties:
                client_id: { type: string }
                grant_type:
                  type: string
                  enum: ['urn:ietf:params:oauth:grant-type:jwt-bearer']
                duration_seconds: { type: integer, minimum: 0, maximum: 86400, default: 900, description: Omit or set to 0 for the default 900 seconds; explicit values must be between 60 and 86400. }
      responses:
        '200':
          description: Short-lived workspace-scoped access token.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
                  expires_in: { type: integer }
        '400': { description: OAuth error. }
        '401': { description: OAuth error. }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    WorkspaceContext:
      name: X-Tracy-Workspace-ID
      in: header
      required: false
      description: Required for user sessions; API keys use their bound workspace.
      schema: { type: string }
    TracePathID:
      name: traceID
      in: path
      required: true
      schema: { type: string }
    TraceID:
      name: trace_id
      in: query
      schema: { type: string }
    Status:
      name: status
      in: query
      schema: { type: string }
    Kind:
      name: kind
      in: query
      schema: { type: string }
    Name:
      name: name
      in: query
      schema: { type: string }
    StartTime:
      name: start_time
      in: query
      schema: { type: string, format: date-time }
    EndTime:
      name: end_time
      in: query
      schema: { type: string, format: date-time }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request or query.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The current user lacks the required Workspace permission.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: Payload exceeds configured limits.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    User:
      type: object
      required: [id, email, name]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
    Workspace:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    APIKey:
      type: object
      required: [id, workspace_id, name, role, revoked]
      properties:
        id: { type: string }
        workspace_id: { type: string }
        name: { type: string }
        role: { type: string }
        expires_at: { type: string, format: date-time }
        revoked: { type: boolean }
        last_used_at: { type: string, format: date-time }
    CreatedAPIKey:
      allOf:
        - $ref: '#/components/schemas/APIKey'
        - type: object
          required: [token]
          properties:
            token: { type: string }
    SpanInput:
      type: object
      required: [trace_id, span_id, name, start_time]
      properties:
        trace_id: { type: string }
        span_id: { type: string }
        parent_span_id: { type: string }
        name: { type: string }
        kind: { type: string }
        start_time: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        duration: { type: integer, format: int64, description: Nanoseconds }
        status: { type: string }
        status_message: { type: string }
        input: { type: string }
        output: { type: string }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        attributes: { type: object, additionalProperties: true }
    Span:
      allOf:
        - $ref: '#/components/schemas/SpanInput'
        - type: object
          properties:
            workspace_id: { type: string }
    TraceSummary:
      type: object
      required: [workspace_id, trace_id, start_time, end_time, span_count, status]
      properties:
        workspace_id: { type: string }
        trace_id: { type: string }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        span_count: { type: integer }
        status: { type: string }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
    TracePage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TraceSummary' }
        next_cursor: { type: string }
    DashboardMetrics:
      type: object
      properties:
        workspace_id: { type: string }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        request_count: { type: integer, format: int64 }
        error_count: { type: integer, format: int64 }
        error_rate: { type: number }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        avg_latency_ms: { type: number }
        p50_latency_ms: { type: number }
        p95_latency_ms: { type: number }
        latency_sampled: { type: boolean, description: Whether latency statistics use a bounded sample. }
        p99_latency_ms: { type: number }
        usage_breakdown:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              span_count: { type: integer, format: int64 }
              input_tokens: { type: integer, format: int64 }
              output_tokens: { type: integer, format: int64 }
